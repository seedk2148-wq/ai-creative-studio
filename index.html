<label>Describe Your Idea</label>
<textarea id="idea" placeholder="Describe your creative idea..."></textarea>

<button class="btn" onclick="generate()">Generate Creative Prompt ✨</button>

<div class="output" id="output"></div>

<button class="btn" id="copy" onclick="copyResult()" style="display:none">
Copy Prompt
</button>

</div>
</section>

<footer>
<p>© 2026 AI Creative Studio</p>
<p>Creating the Future of Digital Content.</p>
</footer>

<script>
function generate() { const type = document.getElementById("type").value; const product = document.getElementById("product").value.trim(); const style = document.getElementById("style").value; const duration = document.getElementById("duration").value; const platform = document.getElementById("platform").value; const idea = document.getElementById("idea").value.trim();
if (!product) { alert("Please enter your project or product name."); return; }
const result = ` AI CREATIVE STUDIO - PROFESSIONAL PRODUCTION
PROJECT: ${product}
CONTENT TYPE: ${type} VISUAL STYLE: ${style} DURATION: ${duration} PLATFORM: ${platform}
CREATIVE CONCEPT: ${idea || "Create an original cinematic concept for " + product}
VISUAL DIRECTION:
Hollywood cinematic visuals.
Ultra realistic details.
Professional lighting.
Dramatic camera movements.
Premium color grading.
Beautiful transitions.
Emotional storytelling.
PRODUCTION QUALITY:
4K Ultra HD target.
Professional commercial quality.
Cinematic composition.
High-end advertising style.
SCENES:
Powerful cinematic opening.
Beautiful product reveal.
Showcase the main features.
Premium cinematic close-ups.
Strong final advertising message.
Create an unforgettable professional production. `;
const output = document.getElementById("output"); output.textContent = result; output.style.display = "block"; document.getElementById("copy").style.display = "inline-block"; }
function copyResult(){
const text=document.getElementById("output").textContent;
navigator.clipboard.writeText(text)
.then(()=>alert("Prompt copied successfully!"))
.catch(()=>alert("Please select and copy the prompt manually."));
}
</script>

</body>
</html>
